claims:
  - id: C001
    claim: "진화는 '이론'일 뿐이다"
    category: methodology
    pillar: C
    priority: 1
    difficulty: 1
    virality: high
    confidence: settled
    rebuttal: >-
      일상어 '이론(=추측)'과 과학 용어 '이론(=검증된 설명 틀)'의 혼동.
      과학에서 이론은 가설의 상위 개념이며, 사실(관측)을 설명하는 구조다.
      중력도, 세균에 의한 질병 발생도 '이론'이다.
    evidence:
      - "미국 국립과학원(NAS) 정의: 이론은 '자연 세계의 어떤 측면에 대해 충분히 입증된 설명'"
      - "'사실 → 이론'으로 승격하는 위계는 존재하지 않음. 둘은 다른 범주"
    counter: "「그래도 사실은 아니지 않나」 → 진화는 사실(관측된 변화)이자 이론(그 변화의 설명)이다. 두 층위가 모두 있다."
    sources: [S-NAS-2008]
    status: drafted
    episode: EP001

  - id: C002
    claim: "열역학 제2법칙이 진화를 반증한다"
    category: physics
    pillar: A
    priority: 1
    difficulty: 2
    virality: high
    confidence: settled
    rebuttal: >-
      제2법칙은 '고립계'의 전체 엔트로피에 대한 진술이다. 지구는 고립계가 아니라
      태양으로부터 지속적으로 에너지를 받는 열린 계다. 국소적 질서 증가는
      전체 엔트로피 증가와 완전히 양립한다.
    evidence:
      - "지구가 받는 태양 복사: 약 1.7×10^17 W. 유입 에너지가 있는 계에서 국소 엔트로피 감소는 일상적"
      - "반례가 일상에 널려 있음: 냉장고, 눈 결정, 수정란에서 성체로의 발생"
      - "당신이 어제보다 오늘 더 복잡한 성인이 된 것 자체가 제2법칙 위반이 아니다"
    counter: "「에너지만 있으면 안 되고 변환 메커니즘이 필요하다」 → 있다. 광합성과 대사가 정확히 그 메커니즘이다."
    sources: [S-NASA-SOLAR]
    status: drafted
    episode: EP002

  - id: C003
    claim: "중간 화석(전이 화석)이 존재하지 않는다"
    category: paleontology
    pillar: A
    priority: 1
    difficulty: 2
    virality: high
    confidence: settled
    rebuttal: >-
      존재할 뿐 아니라, 어디서 나올지 예측하고 찾아낸 사례가 있다.
      틱타알릭은 '어류와 사지류 사이 형태는 데본기 후기 지층에 있어야 한다'는 예측에 따라
      캐나다 엘즈미어섬의 3억7500만 년 전 지층을 겨냥해 탐사한 끝에 발견됐다.
    evidence:
      - "Tiktaalik roseae (2006, Nature): 아가미와 폐, 지느러미 속 손목뼈 구조, 목이 있는 어류"
      - "고래의 육상 조상 계열: Pakicetus → Ambulocetus → Rodhocetus → Dorudon → Basilosaurus"
      - "인류 계열: Australopithecus afarensis → Homo habilis → H. erectus → H. sapiens"
    counter: "「그 사이의 빈틈은?」 → 빈틈 논증은 무한 후퇴다. 화석 하나를 찾을 때마다 빈틈은 오히려 두 개가 된다. 이 논증은 어떤 증거로도 만족될 수 없으므로 반증 불가능하다."
    sources: [S-TIKTAALIK-2006, S-THEWISSEN-2009]
    status: drafted
    episode: EP003

  - id: C004
    claim: "방사성 연대측정은 가정에 의존하므로 믿을 수 없다"
    category: geology
    pillar: A
    priority: 1
    difficulty: 3
    virality: high
    confidence: settled
    rebuttal: >-
      서로 독립적인 붕괴계(U-Pb, K-Ar/Ar-Ar, Rb-Sr, Sm-Nd)가 같은 시료에서 일치하는 값을 낸다.
      등시선(isochron)법은 초기 딸핵종 양을 가정하지 않고 데이터로부터 구한다.
      게다가 방사능과 무관한 연대 지표들이 같은 결론으로 수렴한다.
    evidence:
      - "나이테 연대기: 독일 호헨하임 참나무·소나무 연속 약 12,600년"
      - "호상점토(varve): 일본 스이게쓰호 약 52,800년의 연층, C-14 보정곡선의 기준"
      - "빙하 코어: 남극 EPICA Dome C 약 80만 년 기록 (2004년 1차 보고는 74만 년, 80만 년은 2007년 확장분)"
      - "지구 나이 45.4 ± 0.5억 년 — 운석과 지구 납 동위원소 조성의 일치"
    counter: "「1986년 세인트헬렌스 화산의 새 암석이 수십만 년으로 측정됐다」 → K-Ar법은 젊은 시료에 부적합한 방법이며(유효범위 밖), 해당 측정은 과잉 아르곤과 외래 결정(제노크리스트)을 포함한 시료를 썼다. 방법마다 유효 범위가 있고, 범위 밖에 쓰면 틀린 값이 나오는 건 방법이 작동한다는 뜻이다."
    sources: [S-DALRYMPLE-2004, S-SUIGETSU-2012, S-JOUZEL-2007]
    status: drafted
    episode: EP004

  - id: C005
    claim: "지구는 6,000년~10,000년 되었다"
    category: geology
    pillar: A
    priority: 1
    difficulty: 2
    virality: high
    confidence: settled
    rebuttal: >-
      단일 증거가 아니라 서로 무관한 분야가 전부 훨씬 큰 값으로 수렴한다.
      천문학 하나만으로도 끝난다 — 1987년 초신성까지의 거리는 약 16만 8천 광년이고,
      이 거리는 빛의 메아리(light echo) 고리의 기하학으로 직접 측정됐다.
      그 빛이 우리에게 닿는 데만 16만 년 이상 걸린다.
    evidence:
      - "SN 1987A 거리 약 51.4 kpc ≈ 16만 8천 광년, 고리 기하학으로 독립 측정"
      - "빙하 코어 연층 80만 년, 나이테 12,600년 — 둘 다 세면 되는 직접 계수"
      - "GPS로 측정되는 현재 판 이동 속도와 하와이-엠퍼러 해산열의 연령 구배가 일치"
    counter: "「빛의 속도가 과거에 달랐다」 → 광속이 달랐다면 원자 스펙트럼선·핵반응률이 달라져 먼 은하의 스펙트럼에 흔적이 남는다. 관측되지 않는다."
    sources: [S-PANAGIA-1991, S-JOUZEL-2007, S-USGS-AGE]
    status: backlog
    episode: null

  - id: C006
    claim: "눈처럼 복잡한 기관은 점진적으로 생길 수 없다 (환원 불가능한 복잡성)"
    category: biology
    pillar: A
    priority: 1
    difficulty: 3
    virality: high
    confidence: settled
    rebuttal: >-
      중간 단계가 '쓸모없어서 불가능하다'는 전제가 틀렸다. 모든 중간 단계가
      지금 살아있는 생물에게서 실제로 관찰된다. 빛을 어렴풋이 느끼는 눈은
      전혀 못 느끼는 눈보다 낫다.
    evidence:
      - "현생 연체동물의 눈 스펙트럼: 광수용 반점 → 컵눈 → 핀홀눈(앵무조개, 렌즈 없이 바닷물이 드나듦) → 렌즈눈(문어)"
      - "Nilsson & Pelger(1994): 보수적 가정으로도 평평한 광수용 조직에서 렌즈눈까지 약 36만 세대면 충분"
      - "눈은 동물계에서 독립적으로 여러 번 진화한 것으로 추정됨"
    counter: "「그건 컴퓨터 시뮬레이션일 뿐」 → 시뮬레이션은 시간 추정에만 쓰였다. 중간 단계가 작동한다는 증거는 시뮬레이션이 아니라 지금 바다에 살아있는 앵무조개다."
    sources: [S-NILSSON-1994, S-LAND-2012]
    status: backlog
    episode: null

  - id: C007
    claim: "세균 편모는 부품 하나만 빠져도 작동하지 않으므로 설계된 것이다"
    category: biology
    pillar: A
    priority: 2
    difficulty: 4
    virality: mid
    confidence: strong
    rebuttal: >-
      편모 부품의 부분집합이 독자적으로 기능하는 완전한 기계로 존재한다.
      제3형 분비장치(T3SS)는 편모 기저체와 상동인 단백질들로 이루어져 있고,
      편모 없이 독립적인 기능(단백질 주입)을 수행한다. '빼면 작동 안 함'이 사실이 아니다.
    evidence:
      - "T3SS와 편모 기저체의 상동 단백질군 공유"
      - "2005년 도버 재판에서 이 논점이 법정 반대신문으로 검증됨"
    counter: "「T3SS가 편모에서 파생된 것이지 그 반대가 아니다」 → 파생 방향은 논점이 아니다. 핵심은 '부품 집합이 다른 기능으로도 작동할 수 있다'이며, 이는 환원 불가능성 논증의 전제를 무너뜨린다."
    sources: [S-PALLEN-2006, S-KITZMILLER-2005]
    status: backlog
    episode: null

  - id: C008
    claim: "지층과 화석은 노아의 대홍수로 한 번에 만들어졌다"
    category: geology
    pillar: A
    priority: 1
    difficulty: 3
    virality: high
    confidence: settled
    rebuttal: >-
      한 번의 홍수로는 만들 수 없는 층들이 지층 중간에 끼어 있다.
      두꺼운 증발암층은 물이 '증발'해야 생기고, 화석화된 사막 모래언덕은
      물이 아니라 바람이 쌓아야 생긴다. 홍수 한복판에 사막이 있을 수는 없다.
    evidence:
      - "두꺼운 증발암(암염·석고)층 — 형성 조건이 홍수와 정면으로 모순"
      - "코코니노 사암의 풍성(바람) 사층리와 육상 파충류 발자국"
      - "제자리에서 자란 상태의 화석 산호초가 여러 층준에 반복 출현"
      - "화석 순서의 예외 없음 — 선캄브리아기 지층에서 토끼가 나온 적이 단 한 번도 없다"
    counter: "「여러 지층을 관통하는 나무 화석(polystrate)이 급속 퇴적의 증거다」 → 그건 국지적 급속 매몰(화산재, 범람원)로 설명되며 지질학이 이미 인정하는 현상이다. 노바스코샤 조긴스에서는 각 나무가 서로 다른 층준에서 각각 매몰된 것이 확인된다. 전 지구 동시 홍수의 증거가 아니다."
    sources: [S-PROTHERO-2017, S-JOGGINS]
    status: backlog
    episode: null

  - id: C009
    claim: "인간과 유인원은 염색체 수가 달라(46 vs 48) 공통조상일 수 없다"
    category: genetics
    pillar: B
    priority: 1
    difficulty: 3
    virality: high
    confidence: settled
    rebuttal: >-
      이건 반박 소재가 아니라 진화론이 맞혔다는 증거다. 공통조상이 사실이라면
      인간 염색체 어딘가에 '두 개가 합쳐진 흔적'이 있어야 한다는 예측이 가능하고,
      실제로 인간 2번 염색체 한가운데에서 그 흔적이 발견됐다.
    evidence:
      - "인간 2번 염색체는 침팬지 2A·2B 두 개에 정확히 대응"
      - "염색체 중간부에 텔로미어 반복서열(TTAGGG)이 머리를 맞댄 형태로 잔존 — 원래 끝이었던 자리"
      - "비활성화된 두 번째 동원체(센트로미어) 잔재도 예측된 위치에 존재"
    counter: "「설계자가 그렇게 만들었다」 → 그렇다면 왜 하필 '융합된 것처럼 보이는' 흔적을, 그것도 예측된 바로 그 자리에 남겼는가. 설계 가설은 이 위치를 미리 예측하지 못한다."
    sources: [S-IJDO-1991]
    status: backlog
    episode: null

  - id: C010
    claim: "DNA 유사성은 공통조상이 아니라 공통 설계자 때문이다"
    category: genetics
    pillar: B
    priority: 2
    difficulty: 4
    virality: mid
    confidence: settled
    rebuttal: >-
      '잘 만든 부품의 재사용'이라면 설계 가설로 설명할 수 있다. 그런데 인간과 침팬지가
      공유하는 것 중에는 고장 난 바이러스 잔해가 있다. 인간 게놈의 약 8%가 과거에
      감염된 레트로바이러스의 사체이고, 그중 다수가 침팬지 게놈의 '똑같은 위치'에 박혀 있다.
    evidence:
      - "내인성 레트로바이러스(ERV)가 인간 게놈의 약 8% 차지"
      - "삽입 위치는 거의 무작위인데, 인간과 침팬지가 동일 좌위에 동일 ERV를 공유"
      - "비타민C 합성 유전자(GULO)가 인간·유인원에서 '같은 위치의 같은 돌연변이'로 고장 나 있음. 기니피그도 고장 났지만 돌연변이 위치가 다름"
    counter: "「기능이 있는 ERV도 있다」 → 일부는 실제로 기능을 획득했다(태반 syncytin 등). 그것이 바로 진화가 예측하는 바(고장난 부품의 용도 전환)이며, 공유 좌위 패턴은 그대로 남는다."
    sources: [S-ERV-2001, S-NISHIKIMI-1994]
    status: backlog
    episode: null

  - id: C011
    claim: "돌연변이는 항상 해롭다 / 유익한 돌연변이는 없다"
    category: genetics
    pillar: A
    priority: 1
    difficulty: 2
    virality: high
    confidence: settled
    rebuttal: >-
      대부분의 돌연변이가 중립이거나 해로운 것은 맞다. 그러나 '항상'은 틀렸고,
      진화에 필요한 건 '항상'이 아니라 '가끔'이다. 유익한 돌연변이는 이름과 위치까지 특정돼 있다.
    evidence:
      - "락타아제 지속성: 성인이 우유를 소화하는 형질. 유럽과 아프리카에서 서로 다른 변이로 독립 발생"
      - "CCR5-Δ32: HIV 감염 저항성"
      - "EPAS1 변이: 티베트 고지대 저산소 적응"
      - "Lenski 장기진화실험: 3만 세대 이후 대장균이 산소 존재 하에서 시트르산을 이용하는 능력을 새로 획득"
    counter: "「그건 기능 상실이지 획득이 아니다」 → CCR5는 상실형이 맞다. 그러나 Cit+와 항동결 단백질은 새 기능 획득이다. 남극 빙어의 항동결 단백질은 소화효소 유전자가 중복된 뒤 용도를 바꾼 것으로 추적된다."
    sources: [S-LENSKI-2008, S-CHEN-1997, S-TISHKOFF-2007]
    status: backlog
    episode: null

  - id: C012
    claim: "소진화는 인정하지만 대진화(종의 경계를 넘는 변화)는 관찰된 적이 없다"
    category: biology
    pillar: A
    priority: 1
    difficulty: 3
    virality: high
    confidence: strong
    rebuttal: >-
      종분화는 관찰됐다. 게다가 '소진화'와 '대진화'는 다른 과정이 아니라
      같은 과정에 걸린 시간의 차이다. 경계를 넘을 수 없다고 주장하려면
      그 경계가 무엇인지 먼저 정의해야 하는데, 창조과학 쪽에서 '종류(baramin)'의
      조작적 정의를 제시한 적이 없다.
    evidence:
      - "갈라파고스 'Big Bird' 계통: 교잡 개체군이 2~3세대 만에 생식적으로 격리됨 (2018, Science)"
      - "런던 지하철 모기 Culex pipiens molestus: 지상 개체군과 교배가 거의 되지 않음"
      - "사과실파리 Rhagoletis pomonella: 기주 전환에 의한 동소적 종분화 진행 중"
    counter: "「그래도 여전히 핀치새이고 모기 아닌가」 → 진화는 생물이 자기 조상 계통을 벗어나는 걸 예측하지 않는다. 오히려 그런 일이 일어나면 진화론이 반증된다. 새에서 포유류가 나오길 기대하는 건 진화론이 아니라 그 반대다."
    sources: [S-LAMICHHANEY-2018, S-BYRNE-1999]
    status: backlog
    episode: null

  - id: C013
    claim: "캄브리아기 대폭발은 생물이 갑자기 창조되었음을 보여준다"
    category: paleontology
    pillar: A
    priority: 2
    difficulty: 4
    virality: mid
    confidence: strong
    rebuttal: >-
      '폭발'은 지질학적 표현이고, 실제 기간은 약 2천만~2천5백만 년이다.
      인류 계통 전체가 갈라져 나온 시간보다 훨씬 길다. 또한 그 앞에
      에디아카라 생물군이라는 선행 다세포 생물상이 존재한다.
    evidence:
      - "에디아카라기(약 5억7500만~5억4100만 년 전) 다세포 생물군의 선행"
      - "골격 광물화가 시작되며 화석화 확률 자체가 급증한 보존 편향"
      - "분자시계 분석은 주요 동물문의 분기를 캄브리아기보다 이른 시점으로 추정"
    counter: "「분자시계와 화석 기록이 안 맞지 않나」 → 실제로 불일치가 있고 활발한 연구 주제다. 여기는 솔직하게 '논쟁 중'이라고 말해야 하는 지점이다. 다만 불일치가 있다는 것이 '갑자기 창조됐다'의 근거가 되지는 않는다."
    sources: [S-ERWIN-2011]
    status: backlog
    episode: null

  - id: C014
    claim: "창조과학도 과학이므로 학교에서 함께 가르쳐야 한다"
    category: methodology
    pillar: D
    priority: 1
    difficulty: 2
    virality: high
    confidence: settled
    rebuttal: >-
      과학인지 아닌지는 결론이 아니라 방법으로 판정한다. 창조과학은
      반증 조건을 제시하지 않고, 검증 가능한 새 예측을 내놓지 않으며,
      동료평가 학술지에 연구 성과를 축적하지 않는다.
      이 판단은 미국 법정에서 증거를 놓고 심리한 뒤 세 차례 내려졌다.
    evidence:
      - "McLean v. Arkansas (1982): 창조과학은 과학의 요건을 충족하지 못함"
      - "Edwards v. Aguillard (1987): 미 연방대법원, 창조론 교육 의무화법 위헌"
      - "Kitzmiller v. Dover (2005): 지적설계는 종교의 재포장이라는 판결. 담당 존스 판사는 공화당 부시 대통령이 임명한 보수 성향 판사였다"
    counter: "「양쪽을 다 가르치고 학생이 판단하게 하자」 → 교육과정은 검증된 지식을 가르치는 곳이지 미검증 주장에 동등한 시간을 배분하는 곳이 아니다. 지구 평면설도 '양쪽'에 넣을 것인가."
    sources: [S-KITZMILLER-2005, S-EDWARDS-1987]
    status: backlog
    episode: null

  - id: C015
    claim: "파스퇴르가 자연발생설을 반증했으므로 생명이 저절로 생길 수 없다"
    category: methodology
    pillar: A
    priority: 2
    difficulty: 2
    virality: mid
    confidence: settled
    rebuttal: >-
      범주 오류다. 파스퇴르가 반박한 건 '썩은 고기에서 구더기가, 곡물 더미에서 쥐가
      며칠 만에 저절로 생긴다'는 당대의 자연발생설이다. 화학진화 가설은
      수억 년에 걸쳐 단순한 화학 반응이 누적되는 전혀 다른 주장이다.
    evidence:
      - "파스퇴르 실험(1859~1864)은 '멸균된 배지에 현대 미생물이 며칠 만에 출현하는가'를 검증한 것"
      - "두 주장은 시간 규모가 10^11배 이상, 출발 물질과 메커니즘이 모두 다르다"
    counter: "「그럼 생명의 기원은 설명할 수 있나」 → 아직 못 한다. 이 부분은 열린 문제이고 그렇게 말해야 한다. 다만 '아직 모른다'가 '그러므로 창조됐다'를 뜻하지는 않는다. 그건 무지에 호소하는 논증이다."
    sources: [S-PASTEUR-HIST]
    note: "confidence 주의 — 생명 기원 자체를 다룰 때는 active로 내려갈 것"
    status: backlog
    episode: null

  - id: C016
    claim: "다윈은 임종 직전에 진화론을 철회하고 회개했다"
    category: history
    pillar: D
    priority: 3
    difficulty: 1
    virality: high
    confidence: settled
    rebuttal: >-
      이른바 '레이디 호프 이야기'는 다윈 사후 수십 년 뒤에 퍼진 것이고,
      다윈의 딸 헨리에타가 공개적으로 부인했다. 그리고 설령 사실이라 해도
      논점과 무관하다 — 발견자의 말년 심경은 증거의 타당성을 바꾸지 않는다.
    evidence:
      - "다윈의 딸 헨리에타 리치필드의 공개 부인(1922): 임종 자리에 그 인물은 없었고 철회도 없었다"
      - "설령 사실이어도 발생론적 오류 — 뉴턴이 연금술을 믿었다고 해서 만유인력이 틀리지 않는다"
    counter: "「아니 땐 굴뚝에 연기 나겠나」 → 연기는 굴뚝이 아니라 1915년 출판물에서 났다. 출처가 특정된다."
    sources: [S-LADYHOPE]
    status: backlog
    episode: null

  - id: C017
    claim: "진화론이 나치즘과 우생학, 인종주의의 원인이다"
    category: history
    pillar: D
    priority: 2
    difficulty: 3
    virality: high
    confidence: settled
    rebuttal: >-
      이건 과학적 반박이 아니라 도덕적 연좌제다. 어떤 이론이 악용됐다는 사실은
      그 이론의 참·거짓과 무관하다(발생론적 오류). 또한 '자연에서 이렇다'에서
      '그러므로 이렇게 해야 한다'는 도출되지 않는다(자연주의적 오류).
    evidence:
      - "사실 명제(is)에서 당위 명제(ought)는 논리적으로 도출되지 않는다 — 흄"
      - "우생학은 인공선택 발상이며, 자연선택은 오히려 유전적 다양성의 가치를 설명한다"
      - "화학이 독가스에 쓰였다고 해서 원자론이 틀린 것이 되지 않는다"
    counter: "역공(‘종교도 전쟁을 일으켰다’)은 쓰지 말 것. 같은 오류를 반복하는 것이며 채널 톤을 망친다. 논리 구조만 지적하고 끝낸다."
    sources: [S-WEIKART-2013, S-LEONARD-2005]
    note: "논리 분석 편이지만 역사적 주장을 다루므로 사료가 필요하다. S-WEIKART-2013은 상대편의 가장 강한 학술 논변이므로 반드시 먼저 읽고 정확히 대변한 뒤 반박할 것 — 편집 정책 §2 3단계"
    status: backlog
    episode: null

  - id: C018
    claim: "바나나는 인간이 쥐기 좋게 설계되었다 (신의 창조 증거)"
    category: biology
    pillar: A
    priority: 3
    difficulty: 1
    virality: high
    confidence: settled
    rebuttal: >-
      우리가 먹는 바나나는 수천 년에 걸친 인간의 인공선택 결과물이다.
      야생 바나나는 단단한 씨가 가득 차 있어 먹기 매우 어렵다.
      설계의 증거로 든 것이 하필 인간이 개량한 작물이었다.
    evidence:
      - "재배종 캐번디시는 씨 없는 삼배체 품종 — 접붙이기·분주로만 번식"
      - "야생 바나나(Musa acuminata)는 크고 단단한 씨로 가득"
      - "이 주장을 처음 제기한 본인이 이후 오류를 인정했다"
    counter: "가볍고 재미있는 소재지만 조롱조로 가지 말 것. '이 사례는 인공선택이 얼마나 강력한지 보여준다'로 착지시키면 교육 콘텐츠가 된다."
    sources: [S-MUSA-DOMEST]
    status: backlog
    episode: null

  - id: C019
    claim: "달의 후퇴 속도로 계산하면 지구-달 계는 15억 년 이상 될 수 없다"
    category: astronomy
    pillar: A
    priority: 3
    difficulty: 4
    virality: low
    confidence: strong
    rebuttal: >-
      현재 후퇴율(연 3.8cm)을 과거로 단순 외삽한 계산이다. 조석 소산율은
      대륙 배치와 해양 분지의 형상에 따라 크게 달라지며, 현재는 대서양의 형상 때문에
      지질 시대 평균보다 이례적으로 높다.
    evidence:
      - "아폴로 반사경을 이용한 달 레이저 거리측정으로 현재 후퇴율 연 3.8cm 확인"
      - "조석 리듬암(tidal rhythmite) 기록으로 과거 지구-달 거리 복원 가능 — 과거 후퇴율이 더 느렸음을 시사"
    counter: "「그래도 외삽이 왜 틀린가」 → 외삽이 성립하려면 '비율이 일정했다'는 가정이 필요한데, 바로 그 가정을 지질 기록이 반증한다. 연대측정의 가정을 문제 삼으면서 자기 계산에는 훨씬 강한 가정을 쓰는 셈이다."
    sources: [S-WILLIAMS-2000]
    status: backlog
    episode: null

  - id: C020
    claim: "혜성은 수명이 짧으므로 태양계가 젊다"
    category: astronomy
    pillar: B
    priority: 3
    difficulty: 3
    virality: mid
    confidence: settled
    rebuttal: >-
      단주기 혜성의 수명이 짧은 건 사실이다. 그래서 천문학자들은 '공급원이 있어야 한다'고
      예측했고, 그 예측대로 카이퍼 벨트가 발견됐다. 반박 소재가 아니라
      과학적 예측이 관측으로 확인된 사례다.
    evidence:
      - "1951년 카이퍼가 해왕성 바깥 천체 띠를 예측, 1992년 첫 천체 발견 이후 수천 개 확인"
      - "뉴허라이즌스 탐사선이 2019년 카이퍼 벨트 천체 아로코스를 근접 통과 촬영"
      - "장주기 혜성의 궤도 분포로부터 오르트 구름 추론"
    counter: "「오르트 구름은 직접 관측된 적 없다」 → 맞다. 오르트 구름은 아직 직접 관측되지 않았고 그렇게 말해야 한다. 그러나 카이퍼 벨트는 직접 관측됐고, 단주기 혜성 문제는 그것만으로 해결된다."
    sources: [S-NEWHORIZONS-2019]
    status: backlog
    episode: null

  - id: C021
    claim: "흔적기관은 사실 기능이 있으므로 진화의 증거가 아니다"
    category: biology
    pillar: A
    priority: 2
    difficulty: 3
    virality: mid
    confidence: settled
    rebuttal: >-
      흔적기관의 정의를 잘못 알고 있다. vestigial은 '아무 기능이 없다'가 아니라
      '조상에서 수행하던 원래 기능을 잃었거나 크게 축소됐다'는 뜻이다.
      맹장에 면역 기능이 있어도, 초식 조상의 소화 기능을 잃은 것은 그대로다.
    evidence:
      - "고래·돌고래의 골반뼈와 뒷다리 잔재 — 체벽 안에 떠 있음"
      - "보아·비단뱀의 골반 박차"
      - "동굴어·동굴도롱뇽의 피부에 덮인 퇴화한 눈"
      - "인간의 꼬리뼈, 귀를 움직이는 이개근, 사랑니"
    counter: "「고래 골반뼈는 생식에 쓰인다」 → 그렇다. 그것이 바로 흔적기관의 정의에 부합한다. 다리 기능을 잃고 다른 용도로 남은 것."
    sources: [S-BEJDER-2002]
    status: backlog
    episode: null

  - id: C022
    claim: "공룡 발자국과 사람 발자국이 같은 지층에서 함께 발견됐다 (팔럭시 강)"
    category: paleontology
    pillar: A
    priority: 3
    difficulty: 2
    virality: mid
    confidence: settled
    rebuttal: >-
      텍사스 팔럭시 강의 '사람 발자국'은 침식으로 형태가 뭉개진 수각류 공룡 발자국이며,
      일부는 대공황기에 관광용으로 조각된 위조품이다.
      주요 창조론 단체들도 이 증거의 사용 중단을 권고했다.
    evidence:
      - "발자국 내부에서 수각류 발가락 자국 윤곽이 확인됨"
      - "일부 표본에서 조각 흔적과 판매 기록 확인"
      - "창조론 진영 내부에서도 사용 자제 권고가 나온 사례"
    counter: "이 편은 '저쪽도 스스로 철회한 주장'이라는 점이 핵심이다. 조롱 대신 '증거를 검증하고 철회하는 것이 정상이다'로 마무리하면 우리 정정 정책과도 연결된다."
    sources: [S-KUBAN-1989]
    status: backlog
    episode: null

  - id: C023
    claim: "무작위 과정으로는 새로운 유전 정보가 생길 수 없다"
    category: genetics
    pillar: A
    priority: 1
    difficulty: 4
    virality: mid
    confidence: settled
    rebuttal: >-
      '정보'를 정의하지 않은 채 쓰는 주장이다. 측정 가능한 정의(염기쌍 수, 유전자 수,
      기능 수)를 적용하면 증가 사례가 실제로 관찰된다. 핵심 메커니즘은
      유전자 중복 후 분기다 — 복사본 하나가 원래 일을 계속하는 동안 다른 복사본이 자유롭게 변한다.
    evidence:
      - "남극 빙어의 항동결 당단백질 유전자가 소화효소(트립시노겐) 유전자에서 유래한 것으로 추적됨"
      - "척추동물 색각: 옵신 유전자 중복 후 파장 민감도 분기"
      - "신대륙 짖는원숭이에서 3색각이 독립적으로 진화"
    counter: "「그건 기존 정보의 재배열이지 새 정보가 아니다」 → 그 기준이라면 어떤 관찰도 '새 정보'로 인정되지 않는다. 반증 불가능한 정의는 과학적 주장이 아니다. 먼저 '무엇이 관찰되면 정보 증가로 인정할 것인지' 물어야 한다."
    sources: [S-CHEN-1997, S-OHNO-1970]
    status: backlog
    episode: null

  - id: C024
    claim: "많은 과학자들이 진화론을 의심하고 있다"
    category: methodology
    pillar: C
    priority: 2
    difficulty: 1
    virality: high
    confidence: settled
    rebuttal: >-
      숫자를 실제로 세어보면 반대다. 미국 국립과학교육센터는 이를 유머로 증명했다 —
      '스티브'라는 이름을 가진 과학자만 모아 진화론 지지 서명을 받았는데,
      그 명단이 지적설계 측 전체 서명자 명단보다 길어졌다.
    evidence:
      - "프로젝트 스티브: 이름이 Steve/Stephen 계열인 과학자로만 1,400명 이상 서명"
      - "미국에서 Steve 계열 이름 비율은 약 1% — 전체로 환산하면 규모 차이가 드러난다"
    counter: "「과학은 다수결이 아니다」 → 맞다. 그래서 이 편의 결론은 '다수라서 옳다'가 아니라 '소수라는 주장 자체가 사실이 아니다'까지다. 그 선을 넘지 말 것."
    sources: [S-PROJECTSTEVE]
    status: backlog
