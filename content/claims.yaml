  - id: C025
    claim: "우주 상수들이 생명에 맞게 미세조정되어 있다"
    category: cosmology
    pillar: A
    priority: 3
    difficulty: 5
    virality: mid
    confidence: active
    rebuttal: >-
      이 편은 조심해서 다뤄야 한다. 미세조정 자체는 물리학계에서도 열린 문제이고,
      우리가 반박하는 것은 '조정되어 보인다'는 관찰이 아니라 거기서 설계로 넘어가는 추론 단계다.
      관측자가 존재할 수 있는 우주에서만 관측이 이루어진다는 선택 효과,
      그리고 표본이 1개뿐인 상태에서 확률을 말할 수 없다는 문제가 있다.
    evidence:
      - "관측 선택 효과(인류원리): 생명이 불가능한 우주에는 그것을 관측할 존재가 없다"
      - "상수를 하나씩 따로 바꾸는 계산 방식의 한계 — 여러 상수를 동시에 바꾸면 생명 가능 영역이 넓어진다는 연구들"
    counter: "이 편은 결론을 '따라서 설계가 아니다'로 내지 말 것. '이 논증은 현재 과학이 판정할 수 있는 형태가 아니다'까지가 정직한 착지점이다. 정직함이 이 편의 설득력이다."
