# 접종(prebunking) 시리즈 《이런 말이 나오면 의심하세요》
#
# claims.yaml 이 "이 주장은 왜 틀렸는가"라면, 이 파일은 "이 논법은 왜 안 통하는가"입니다.
# 특정 주장이 아니라 **논법 자체**를 가르치므로, 시청자가 다음에 만날 다른 주장에도 전이됩니다.
#
# 근거: Debunking Handbook 2020 — "technique- or logic-based rebuttal ... transfers outside
# a specific context" / "misinformation is sticky, it's best preempted ... 'inoculation'"
# → docs/14-debunking-method.md §3, §8
#
# 각 항목의 핵심은 `test` 입니다 — 시청자가 들고 다닐 수 있는 **한 문장짜리 질문**.
# 이게 이 시리즈가 파는 유일한 물건입니다.

version: 1
updated: 2026-09-19

families:
  - id: F01
    name: 반증 불가능하게 만들기
    episode_title: "어떤 증거를 가져와도 부족하다고 할 때"
    priority: 1
    test: "무엇이 관찰되면 그 주장이 틀린 게 됩니까?"
    tell: >-
      증거를 가져갈 때마다 요구가 한 칸씩 뒤로 물러납니다.
      "중간 화석이 없다" → 찾아오면 → "그럼 그 사이는?"
    why_it_works: >-
      반증 조건이 없는 주장은 지는 법이 없어서 **강해 보입니다.**
      실제로는 그 반대입니다 — 어떤 관찰도 배제하지 않는 문장은 세상에 대해 아무것도 말하지 않습니다.
    covers: [C003, C008, C010, C012, C023]
    example: "무한 후퇴 요구(중간화석), 임시방편 가설(홍수지질학), 반증 불가능한 정의(정보)"

  - id: F02
    name: 같은 단어 다른 뜻
    episode_title: "한 단어를 두 가지 뜻으로 쓸 때"
    priority: 1
    test: "그 단어를 정의해 주세요. 문장 앞뒤에서 같은 뜻입니까?"
    tell: >-
      논증의 앞부분과 뒷부분에서 핵심 단어의 뜻이 바뀌어 있습니다.
    why_it_works: >-
      단어가 같으니 논리가 이어지는 것처럼 **들립니다.**
      귀는 단어를 듣지 뜻을 듣지 않습니다.
    covers: [C001, C015, C021]
    example: "'이론'(추측 vs 검증된 설명틀), '흔적기관'(기능 전무 vs 원래 기능 상실)"

  - id: F03
    name: 조건 떼고 인용하기
    episode_title: "인용이 짧을 때 의심하세요"
    priority: 1
    test: "원문을 보여주세요. 앞뒤 문단까지요."
    tell: >-
      인용문이 유난히 짧고, 출처가 2차이며, 조건절이 잘려 있습니다.
    why_it_works: >-
      인용은 이미 검증된 것처럼 들리고, **원문을 확인하는 사람은 거의 없습니다.**
      이 채널이 출처를 화면에 고정하는 이유가 이것입니다.
    covers: [C002, C005, C018, C022]
    example: "'고립계'를 뺀 열역학 제2법칙, 진영 내부에서도 철회한 팔럭시 발자국"
    note: "우리 자신에게 가장 위험한 편. 이 편을 내는 순간 우리 인용이 전부 검증 대상이 됩니다 — 그래서 내야 합니다"

  - id: F04
    name: 나한테만 엄격한 잣대
    episode_title: "그 기준을 본인 주장에 적용하면"
    priority: 2
    test: "그 기준을 당신 주장에 그대로 적용하면 어떻게 됩니까?"
    tell: >-
      상대 방법의 가정은 조목조목 문제 삼으면서, 자기 계산의 가정은 언급하지 않습니다.
    why_it_works: >-
      회의적 태도는 그 자체로 **과학적으로 보입니다.**
      문제는 회의가 한쪽에만 적용될 때입니다.
    covers: [C004, C014, C019]
    example: "연대측정의 가정은 공격하면서 '달 후퇴율이 45억 년간 일정했다'는 더 강한 가정을 씀"

  - id: F05
    name: 주장 말고 사람 건드리기
    episode_title: "발견한 사람이 나쁘면 발견도 틀립니까"
    priority: 2
    test: "그게 사실이라고 쳐도, 증거가 달라집니까?"
    tell: >-
      발견자의 인성·말년·정치 성향, 또는 "많은 과학자가 의심한다"가 논거로 등장합니다.
    why_it_works: >-
      사람 이야기가 데이터보다 **기억에 남습니다.**
      그리고 듣는 사람은 이미 판단을 내린 뒤에 그 이유를 찾습니다.
    covers: [C016, C017, C024]
    example: "다윈 임종 회개설, 진화론-나치 연결, 프로젝트 스티브"
    note: "우리가 가장 쉽게 따라 하게 되는 오류. 역공('종교도 전쟁을 일으켰다') 금지 — 편집 정책 §1"

  - id: F06
    name: 상상이 안 되니까 불가능하다
    episode_title: "'도저히 그럴 리가 없다'는 증거가 아닙니다"
    priority: 2
    test: "당신이 상상하지 못하는 것과 일어날 수 없는 것은 다릅니다."
    tell: >-
      "도저히 ~일 리가 없다", "우연히 ~할 확률은 0에 가깝다" 같은 표현이 논거의 중심입니다.
    why_it_works: >-
      직관은 **큰 수와 긴 시간에 대해 신뢰할 수 없습니다.**
      40억 년과 10억 년의 차이를 느낄 수 있는 사람은 없습니다.
    covers: [C006, C007, C011, C025]
    example: "눈의 복잡성, 환원 불가능성, 미세조정 확률 논증"

  - id: F07
    name: 예측을 못 읽기
    episode_title: "과학이 강한 건 맞혔기 때문입니다"
    priority: 1
    test: "그 발견은 어느 쪽이 **미리** 예측한 겁니까?"
    tell: >-
      이론이 맞힌 증거가 오히려 반례처럼 제시됩니다.
    why_it_works: >-
      예측과 사후 설명의 차이는 직관적이지 않습니다. **결과만 보면 둘 다 '설명'으로 보입니다.**
      차이는 시점에 있습니다 — 보기 전에 말했는가.
    covers: [C009, C013, C020]
    example: >-
      틱타알릭(지층을 지정하고 발굴), 인간 2번 염색체 융합 흔적(위치까지 예측),
      카이퍼 벨트(공급원을 예측하고 발견)
    note: "시리즈에서 유일하게 공격이 아닌 편. B기둥 성격이라 공유·저장이 가장 잘 나올 후보"
