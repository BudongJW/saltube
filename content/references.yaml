  abstract: genetic variation was quantified between surface-dwelling populations of culex pipiens and
    the so-called molestus form found in the london underground (the underground) railway system. the
    molestus form is a commercially important biting nuisance and in the southern part of its range is
    also a disease vector. the surface and subterranean populations were genetically distinct, with no
    evidence of gene flow between closely adjacent populations of the different forms, whereas there was
    little differentiation between the different populations of each form. the substantially reduced heterozygosity
    in the underground populations and the allelic composition suggest that colonization of the underground
    has occurred once or very few times. breeding experiments show compatibility between the underground
    populations but not with those breeding above ground. there is evidence of greater gene flow and a
    mixing of molestus and pipiens traits in the south of the species range. this paper considers the
    processes that may allow establishment of reproductive isolation in the north of the species range
    but not in the south.
