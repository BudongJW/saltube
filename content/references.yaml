    array was placed on the moon, enabling highly accurate measurements of the earthmoon separation by
    means of laser ranging. lunar laser ranging (llr) turns the earthmoon system into a laboratory for
    a broad range of investigations, including astronomy, lunar science, gravitational physics, geodesy,
    and geodynamics. contributions from llr include the three-orders-of-magnitude improvement in accuracy
    in the lunar ephemeris, a several-orders-of-magnitude improvement in the measurement of the variations
    in the moon's rotation, and the verification of the principle of equivalence for massive bodies with
    unprecedented accuracy. lunar laser ranging analysis has provided measurements of the earth's precession,
