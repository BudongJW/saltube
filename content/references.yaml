  abstract: wrists, ankles and digits distinguish tetrapod limbs from fins, but direct evidence on the
    origin of these features has been unavailable. here we describe the pectoral appendage of a member
    of the sister group of tetrapods, tiktaalik roseae, which is morphologically and functionally transitional
    between a fin and a limb. the expanded array of distal endochondral bones and synovial joints in the
    fin of tiktaalik is similar to the distal limb pattern of basal tetrapods. the fin of tiktaalik was
    capable of a range of postures, including a limb-like substrate-supported stance in which the shoulder
    and elbow were flexed and the distal skeleton extended. the origin of limbs probably involved the
    elaboration and proliferation of features already present in the fins of fish such as tiktaalik.
