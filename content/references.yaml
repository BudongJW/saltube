  abstract: current approaches for classifying and annotating endogenous retroviruses (ervs) and their
    long terminal repeats (ltrs) have limited resolution and are inaccurate. here, we developed an annotation
    approach based on phylogenetic analysis and cross-species conservation. focusing on the evolutionarily
    young ltr subfamilies known as mer11a/b/c, we revealed the presence of four "new subfamilies," suggesting
    a new annotation for 412 (19.8%) of these repeat elements. we then validated their regulatory potential
    using a massively parallel reporter assay. we further identified motifs associated with their differential
    activities including an ape-specific gain of sox-related motifs through a single-nucleotide deletion.
    by applying our approach across 53 simian-enriched ltr subfamilies, we defined 75 new subfamilies
    and found a novel annotation for a total of 3807 (30.0%) instances from 26 subfamilies. with this
    refined annotation of simian-enriched ltrs, it will be possible to better understand the evolution
    in primate genomes and potentially identify critical roles for ervs and their ltrs in the hosts.
