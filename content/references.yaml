  abstract: man is among the exceptional higher animals that are unable to synthesize l-ascorbic acid
    because of their deficiency in l-gulono-gamma-lactone oxidase, the enzyme catalyzing the terminal
    step in l-ascorbic acid biosynthesis. in the present study, we isolated a segment of the nonfunctional
    l-gulono-gamma-lactone oxidase gene from a human genomic library, and mapped it on chromosome 8p21.1
    by spot blot hybridization using flow-sorted human chromosomes and fluorescence in situ hybridization.
    sequencing analysis indicated that the isolated segment represented a 3'-part of the gene, where the
    regions corresponding to exons vii, ix, x, and xii of the rat l-gulono-gamma-lactone oxidase gene
    remain with probable deletion of the regions corresponding to exons viii and xi. in the identified
    exon regions were found various anomalous nucleotide changes, such as deletion and insertion of nucleotide(s)
    and nonconformance to the gt/ag rule at intron/exon boundaries. when the conceptual amino acid sequences
