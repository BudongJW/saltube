  abstract: we have identified two allelic genomic cosmids from human chromosome 2, c8.1 and c29b, each
    containing two inverted arrays of the vertebrate telomeric repeat in a head-to-head arrangement, 5'(ttaggg)n-(ccctaa)m3'.
    sequences flanking this telomeric repeat are characteristic of present-day human pretelomeres. bal-31
    nuclease experiments with yeast artificial chromosome clones of human telomeres and fluorescence in
    situ hybridization reveal that sequences flanking these inverted repeats hybridize both to band 2q13
    and to different, but overlapping, subsets of human chromosome ends. we conclude that the locus cloned
    in cosmids c8.1 and c29b is the relic of an ancient telomere-telomere fusion and marks the point at
