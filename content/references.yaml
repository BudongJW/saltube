  abstract: ▪ abstract the ediacara biota (575-542 ma) marks the first appearance of large, architecturally
    complex organisms in earth history. present evidence suggests that the ediacara biota included a mixture
    of stem- and crown-group radial animals, stem-group bilaterian animals, "failed experiments" in animal
    evolution, and perhaps representatives of other eukaryotic kingdoms. these soft-bodied organisms were
    preserved under (or rarely within) event beds of sand or volcanic ash, and four distinct preservational
    styles (flinders-, fermeuse-, conception-, and nama-style) profoundly affected the types of organisms
    and features that could be preserved. even the earliest ediacaran communities (575-565 ma) show vertical
    and lateral niche subdivision of the sessile, benthic, filter-feeding organisms, which is strikingly
    like that of phanerozoic and modern communities. later biological and ecological innovations include
    mobility (&gt;555 ma), calcification (550 ma), and predation (&lt;549 ma). the ediacara biota abruptly
    disappeared 542 million years ago, probably as a consequence of mass extinction andor biological interactions
    with the rapidly evolving animals of the cambrian explosion.
