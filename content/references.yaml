  abstract: over the past decade the analysis of sedimentary cyclic rhythmites of tidal origin, i.e.,
    stacked thin beds or laminae usually of sandstone, siltstone, and mudstone that display periodic variations
    in thickness reflecting a strong tidal influence on sedimentation, has provided information on earth's
    paleorotation and the evolving lunar orbit for precambrian time (before 540 ma). depositional environments
    of tidal rhythmites range from estuarine to tidal delta, with a wave‐protected, distal ebb tidal delta
    setting being particularly favorable for the deposition and preservation of long, detailed rhythmite
    records. the potential sediment load of nearshore tidal currents and the effectiveness of the tide
    as an agent of sediment entrainment and deposition are related directly to tidal range (or maximum
    tidal height) and consequent current speed. hence the thickness of successive laminae deposited by
    tidal currents can be a proxy tidal record, with paleotidal and paleorotational values being determined
    by analysis of measured records of lamina and cycle thickness. the validity of the findings can be
    investigated by testing the primary, observed values for internal self‐consistency through application
    of the laws of celestial mechanics. paleotidal and paleorotational values provided by late neoproterozoic
    (∼620 ma) tidal rhythmites in south australia are validated by these tests and indicate 13.1±0.1 synodic
    (lunar) months/yr, 400±7 solar days/yr, a length of day of 21.9±0.4 h, and a relative earth‐moon distance
    a/a 0 of 0.965±0.005. the mean rate of lunar recession since that time is 2.17±0.31 cm/yr, which is
    little more than half the present rate of lunar recession of 3.82±0.07 cm/yr obtained by lunar laser
    ranging. the late neoproterozoic data militate against significant overall change in earth's moment
    of inertia and radius at least since 620 ma. cyclicity displayed by paleoproterozoic (2450 ma) banded
    iron formation in western australia may record tidal influences on the discharge and/or dispersal
    of submarine hydrothermal plumes and suggests 14.5±0.5 synodic months/yr and a/a 0 = 0.906±0.029.
    the combined rhythmite data give a mean rate of lunar recession of 1.24±0.71 cm/yr during most of
    the proterozoic (2450-620 ma), suggesting that a close approach of the moon did not occur during earlier
    time. concentrated study of precambrian tidal rhythmites promises to illuminate the evolving dynamics
    of the early earth‐moon system and may permit the lunar orbit to be traced back to near the time of
    the moon's origin.
