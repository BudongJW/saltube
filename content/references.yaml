  abstract: a snp in the gene encoding lactase (lct) (c/t-13910) is associated with the ability to digest
    milk as adults (lactase persistence) in europeans, but the genetic basis of lactase persistence in
    africans was previously unknown. we conducted a genotype-phenotype association study in 470 tanzanians,
    kenyans and sudanese and identified three snps (g/c-14010, t/g-13915 and c/g-13907) that are associated
    with lactase persistence and that have derived alleles that significantly enhance transcription from
    the lct promoter in vitro. these snps originated on different haplotype backgrounds from the european
    c/t-13910 snp and from each other. genotyping across a 3-mb region demonstrated haplotype homozygosity
    extending >2.0 mb on chromosomes carrying c-14010, consistent with a selective sweep over the past
    approximately 7,000 years. these data provide a marked example of convergent evolution due to strong
    selective pressure resulting from shared cultural traits-animal domestication and adult milk consumption.
