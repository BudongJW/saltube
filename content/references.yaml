  abstract: the antarctic vostok ice core provided compelling evidence of the nature of climate, and of
    climate feedbacks, over the past 420,000 years. marine records suggest that the amplitude of climate
    variability was smaller before that time, but such records are often poorly resolved. moreover, it
    is not possible to infer the abundance of greenhouse gases in the atmosphere from marine records.
    here we report the recovery of a deep ice core from dome c, antarctica, that provides a climate record
    for the past 740,000 years. for the four most recent glacial cycles, the data agree well with the
    record from vostok. the earlier period, between 740,000 and 430,000 years ago, was characterized by
    less pronounced warmth in interglacial periods in antarctica, but a higher proportion of each cycle
    was spent in the warm mode. the transition from glacial to interglacial conditions about 430,000 years
    ago (termination v) resembles the transition into the present interglacial period in terms of the
    magnitude of change in temperatures and greenhouse gases, but there are significant differences in
    the patterns of change. the interglacial stage following termination v was exceptionally long--28,000
    years compared to, for example, the 12,000 years recorded so far in the present interglacial period.
    given the similarities between this earlier warm period and today, our results may imply that without
    human intervention, a climate similar to the present one would extend well into the future.
  abstract_source: europepmc
