  abstract: historians disagree about whether nazis embraced darwinian evolution. by examining hitler's
    ideology, the official biology curriculum, the writings of nazi anthropologists, and nazi periodicals,
    we find that nazi racial theorists did indeed embrace human and racial evolution. they not only taught
    that humans had evolved from primates, but they believed the aryan or nordic race had evolved to a
    higher level than other races because of the harsh climatic conditions that influenced natural selection.
    they also claimed that darwinism underpinned specific elements of nazi racial ideology, including
    racial inequality, the necessity of the racial struggle for existence, and collectivism.
