  abstract: the role of historical contingency in evolution has been much debated, but rarely tested.
    twelve initially identical populations of escherichia coli were founded in 1988 to investigate this
    issue. they have since evolved in a glucose-limited medium that also contains citrate, which e. coli
    cannot use as a carbon source under oxic conditions. no population evolved the capacity to exploit
    citrate for &gt;30,000 generations, although each population tested billions of mutations. a citrate-using
    (cit + ) variant finally evolved in one population by 31,500 generations, causing an increase in population
    size and diversity. the long-delayed and unique evolution of this function might indicate the involvement
    of some extremely rare mutation. alternately, it may involve an ordinary mutation, but one whose physical
    occurrence or phenotypic expression is contingent on prior mutations in that population. we tested
    these hypotheses in experiments that "replayed" evolution from different points in that population's
    history. we observed no cit + mutants among 8.4 × 10 12 ancestral cells, nor among 9 × 10 12 cells
    from 60 clones sampled in the first 15,000 generations. however, we observed a significantly greater
    tendency for later clones to evolve cit + , indicating that some potentiating mutation arose by 20,000
    generations. this potentiating change increased the mutation rate to cit + but did not cause generalized
    hypermutability. thus, the evolution of this phenotype was contingent on the particular history of
    that population. more generally, we suggest that historical contingency is especially important when
    it facilitates the evolution of key innovations that are not easily evolved by gradual, cumulative
    selection.
