  abstract: limb reduction and loss are hallmarks of snake evolution. although advanced snakes are completely
    limbless, basal and intermediate snakes retain pelvic girdles and small rudiments of the femur. moreover,
    legs may have re-emerged in extinct snake lineages [1-5], suggesting that the mechanisms of limb development
    were not completely lost in snakes. here we report that hindlimb development arrests in python embryos
    as a result of mutations that abolish essential transcription factor binding sites in the limb-specific
    enhancer of sonic hedgehog (shh). consequently, shh transcription is weak and transient in python
    hindlimb buds, leading to early termination of a genetic circuit that drives limb outgrowth. our results
    suggest that degenerate evolution of the shh limb enhancer played a role in reduction of hindlimbs
    during snake evolution. by contrast, hoxd digit enhancers are conserved in pythons, and hoxd gene
    expression in the hindlimb buds progresses to the distal phase, forming an autopodial (digit) domain.
    python hindlimb buds then develop transitory pre-chondrogenic condensations of the tibia, fibula,
    and footplate, raising the possibility that re-emergence of hindlimbs during snake evolution did not
    require de novo re-evolution of lost structures but instead could have resulted from persistence of
    embryonic legs. video abstract.
