  abstract: modern members of the mammalian order cetacea (whales, dolphins and porpoises) are obligate
    aquatic swimmers that are highly distinctive in morphology, lacking hair and hind limbs, and having
    flippers, flukes, and a streamlined body. eocene fossils document much of cetaceans' land-to-water
    transition, but, until now, the most primitive representative for which a skeleton was known was clearly
    amphibious and lived in coastal environments. here we report on the skeletons of two early eocene
    pakicetid cetaceans, the fox-sized ichthyolestes pinfoldi, and the wolf-sized pakicetus attocki. their
    skeletons also elucidate the relationships of cetaceans to other mammals. morphological cladistic
    analyses have shown cetaceans to be most closely related to one or more mesonychians, a group of extinct,
    archaic ungulates, but molecular analyses have indicated that they are the sister group to hippopotamids.
    our cladistic analysis indicates that cetaceans are more closely related to artiodactyls than to any
    mesonychian. cetaceans are not the sister group to (any) mesonychians, nor to hippopotamids. our analysis
    stops short of identifying any particular artiodactyl family as the cetacean sister group and supports
    monophyly of artiodactyls.
  abstract_source: europepmc
