  abstract: the genetic basis of vertebrate morphological evolution has traditionally been very difficult
    to examine in naturally occurring populations. here we describe the generation of a genome-wide linkage
    map to allow quantitative trait analysis of evolutionarily derived morphologies in the mexican cave
    tetra, a species that has, in a series of independent caves, repeatedly evolved specialized characteristics
