  abstract: dating carbon radiocarbon dating is the best way to determine the age of samples that contain
    carbon and that are younger than ∼50,000 years, the limit of precision for the method. there are several
    factors that complicate such age determinations, however, some of the most important of which include
    variability of the 14 c production in the atmosphere (which affects organic samples whose radiocarbon
    inventories are derived from atmospheric co 2 ), surface ocean reservoir effects (which affect marine
    samples that acquire their radiocarbon signatures from seawater), and variable dead carbon fraction
    effects (which affect speleothems that derive their carbon from groundwaters). bronk ramsey et al.
    (p. 370 ; see the perspective by reimer ) avoid the need to make such assumptions, reporting the 14
    c results of sediments from lake suigetsu, japan. analysis of terrestrial plant macrofossils in annually
    layered datable sediments yielded a direct record of atmospheric radiocarbon for the entire measurable
    interval up to 52.8 thousand years ago.
