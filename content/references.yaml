  abstract: 'in most human populations, the ability to digest lactose contained in milk usually disappears
    in childhood, but in european-derived populations, lactase activity frequently persists into adulthood
    (scrimshaw and murray 1988). it has been suggested (cavalli-sforza 1973; hollox et al. 2001; enattah
    et al. 2002; poulter et al. 2003) that a selective advantage based on additional nutrition from dairy
    explains these genetically determined population differences (simoons 1970; kretchmer 1971; scrimshaw
    and murray 1988; enattah et al. 2002), but formal population-genetics-based evidence of selection
    has not yet been provided. to assess the population-genetics evidence for selection, we typed 101
    single-nucleotide polymorphisms covering 3.2 mb around the lactase gene. in northern european-derived
    populations, two alleles that are tightly associated with lactase persistence (enattah et al. 2002)
    uniquely mark a common (~77%) haplotype that extends largely undisrupted for >1 mb. we provide two
    new lines of genetic evidence that this long, common haplotype arose rapidly due to recent selection:
    (1) by use of the traditional f(st) measure and a novel test based on p(excess), we demonstrate large
    frequency differences among populations for the persistence-associated markers and for flanking markers
    throughout the haplotype, and (2) we show that the haplotype is unusually long, given its high frequency--a
    hallmark of recent selection. we estimate that strong selection occurred within the past 5,000-10,000
    years, consistent with an advantage to lactase persistence in the setting of dairy farming; the signals
    of selection we observe are among the strongest yet seen for any gene in the genome.'
