  abstract: the fossil record of the earliest tetrapods (vertebrates with limbs rather than paired fins)
    consists of body fossils and trackways. the earliest body fossils of tetrapods date to the late devonian
    period (late frasnian stage) and are preceded by transitional elpistostegids such as panderichthys
    and tiktaalik that still have paired fins. claims of tetrapod trackways predating these body fossils
    have remained controversial with regard to both age and the identity of the track makers. here we
    present well-preserved and securely dated tetrapod tracks from polish marine tidal flat sediments
    of early middle devonian (eifelian stage) age that are approximately 18 million years older than the
    earliest tetrapod body fossils and 10 million years earlier than the oldest elpistostegids. they force
    a radical reassessment of the timing, ecology and environmental setting of the fish-tetrapod transition,
    as well as the completeness of the body fossil record.
  abstract_source: europepmc
