  abstract: although rapid adaptive changes in morphology on ecological time scales are now well documented
    in natural populations, the effects of such changes on whole-organism performance capacity and the
    consequences on ecological dynamics at the population level are often unclear. here we show how lizards
    have rapidly evolved differences in head morphology, bite strength, and digestive tract structure
    after experimental introduction into a novel environment. despite the short time scale (≈36 years)
    since this introduction, these changes in morphology and performance parallel those typically documented
    among species and even families of lizards in both the type and extent of their specialization. moreover,
    these changes have occurred side-by-side with dramatic changes in population density and social structure,
    providing a compelling example of how the invasion of a novel habitat can evolutionarily drive multiple
    aspects of the phenotype.
