  abstract: here we present a draft genome sequence of the common chimpanzee (pan troglodytes). through
    comparison with the human genome, we have generated a largely complete catalogue of the genetic differences
    that have accumulated since the human and chimpanzee species diverged from our common ancestor, constituting
    approximately thirty-five million single-nucleotide changes, five million insertion/deletion events,
    and various chromosomal rearrangements. we use this catalogue to explore the magnitude and regional
    variation of mutational forces shaping these two genomes, and the strength of positive and negative
    selection acting on their genes. in particular, we find that the patterns of evolution in human and
    chimpanzee protein-coding genes are highly correlated and dominated by the fixation of neutral and
    slightly deleterious alleles. we also use the chimpanzee genome as an outgroup to investigate human
    population genetics and identify signatures of selective sweeps in recent human evolution.
