  abstract: freezing avoidance conferred by different types of antifreeze proteins in various polar and
    subpolar fishes represents a remarkable example of cold adaptation, but how these unique proteins
    arose is unknown. we have found that the antifreeze glycoproteins (afgps) of the predominant antarctic
    fish taxon, the notothenioids, evolved from a pancreatic trypsinogen. we have determined the likely
    evolutionary process by which this occurred through characterization and analyses of notothenioid
    afgp and trypsinogen genes. the primordial afgp gene apparently arose through recruitment of the 5′
    and 3′ ends of an ancestral trypsinogen gene, which provided the secretory signal and the 3′ untranslated
    region, respectively, plus de novo amplification of a 9-nt thr-ala-ala coding element from the trypsinogen
    progenitor to create a new protein coding region for the repetitive tripeptide backbone of the antifreeze
    protein. the small sequence divergence (4-7%) between notothenioid afgp and trypsinogen genes indicates
    that the transformation of the proteinase gene into the novel ice-binding protein gene occurred quite
    recently, about 5-14 million years ago (mya), which is highly consistent with the estimated times
    of the freezing of the antarctic ocean at 10-14 mya, and of the main phyletic divergence of the afgp-bearing
    notothenioid families at 7-15 mya. the notothenioid trypsinogen to afgp conversion is the first clear
    example of how an old protein gene spawned a new gene for an entirely new protein with a new function.
    it also represents a rare instance in which protein evolution, organismal adaptation, and environmental
    conditions can be linked directly.
