  abstract: changes in past atmospheric carbon dioxide concentrations can be determined by measuring the
    composition of air trapped in ice cores from antarctica. so far, the antarctic vostok and epica dome
    c ice cores have provided a composite record of atmospheric carbon dioxide levels over the past 650,000
    years. here we present results of the lowest 200 m of the dome c ice core, extending the record of
    atmospheric carbon dioxide concentration by two complete glacial cycles to 800,000 yr before present.
    from previously published data and the present work, we find that atmospheric carbon dioxide is strongly
    correlated with antarctic temperature throughout eight glacial cycles but with significantly lower
    concentrations between 650,000 and 750,000 yr before present. carbon dioxide levels are below 180
    parts per million by volume (p.p.m.v.) for a period of 3,000 yr during marine isotope stage 16, possibly
    reflecting more pronounced oceanic carbon storage. we report the lowest carbon dioxide concentration
    measured in an ice core, which extends the pre-industrial range of carbon dioxide concentrations during
    the late quaternary by about 10 p.p.m.v. to 172-300 p.p.m.v.
