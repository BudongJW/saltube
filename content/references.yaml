    volume: '14'
    page: e0210746
    type: journal-article
    status: ok
    checked: '2026-09-19'
  abstract: misinformation poses significant challenges to evidence-based practice. in the public health
    domain specifically, treatment misinformation can lead to opportunity costs or direct harm. alas,
    attempts to debunk misinformation have proven sub-optimal, and have even been shown to "backfire",
    including increasing misperceptions. thus, optimized debunking strategies have been developed to more
    effectively combat misinformation. the aim of this study was to test these strategies in a real-world
    setting, targeting misinformation about autism interventions. in the context of professional development
    training, we randomly assigned participants to an "optimized-debunking" or a "treatment-as-usual"
    training condition and compared support for non-empirically-supported treatments before, after, and
    six weeks following completion of online training. results demonstrated greater benefits of optimized
    debunking immediately after training; thus, the implemented strategies can serve as a general and
    flexible debunking template. however, the effect was not sustained at follow-up, highlighting the
    need for further research into strategies for sustained change.
  abstract_source: europepmc
