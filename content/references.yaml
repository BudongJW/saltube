    title: Correction format has a limited role when debunking misinformation
    container: Cogn. Research
    year: 2021
    volume: '6'
    page: null
    type: journal-article
    status: ok
    checked: '2026-09-19'
  abstract: abstract given that being misinformed can have negative ramifications, finding optimal corrective
    techniques has become a key focus of research. in recent years, several divergent correction formats
    have been proposed as superior based on distinct theoretical frameworks. however, these correction
    formats have not been compared in controlled settings, so the suggested superiority of each format
    remains speculative. across four experiments, the current paper investigated how altering the format
    of corrections influences people's subsequent reliance on misinformation. we examined whether myth-first,
    fact-first, fact-only, or myth-only correction formats were most effective, using a range of different
    materials and participant pools. experiments 1 and 2 focused on climate change misconceptions; participants
    were qualtrics online panel members and students taking part in a massive open online course, respectively.
    experiments 3 and 4 used misconceptions from a diverse set of topics, with amazon mechanical turk
    crowdworkers and university student participants. we found that the impact of a correction on beliefs
    and inferential reasoning was largely independent of the specific format used. the clearest evidence
    for any potential relative superiority emerged in experiment 4, which found that the myth-first format
    was more effective at myth correction than the fact-first format after a delayed retention interval.
    however, in general it appeared that as long as the key ingredients of a correction were presented,
    format did not make a considerable difference. this suggests that simply providing corrective information,
    regardless of format, is far more important than how the correction is presented.
  abstract_source: crossref
