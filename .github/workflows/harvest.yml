name: harvest

# 새 레퍼런스 후보를 정기 수집해 PR 로 올립니다.
# 자동 등재하지 않습니다 — 사람이 원문을 읽고 promote 해야 합니다 (편집 정책 §2).

on:
  schedule:
    - cron: "0 2 1 * *"     # 매월 1일 02:00 UTC
  workflow_dispatch:
    inputs:
      since:
        description: "이 날짜 이후 발행분 (YYYY-MM-DD). 비우면 최근 120일"
        required: false
      min_score:
        description: "Crossref 관련도 최소값 (기본 12)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet pyyaml

      - name: 레퍼런스 후보 수집
        run: |
          ARGS=""
          [ -n "${{ inputs.since }}" ] && ARGS="$ARGS --since ${{ inputs.since }}"
          [ -n "${{ inputs.min_score }}" ] && ARGS="$ARGS --min-score ${{ inputs.min_score }}"
          python3 tools/harvest.py run $ARGS | tee harvest.log

      - name: 변경 여부 확인
        id: diff
        run: |
          if git diff --quiet --exit-code content/inbox/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: PR 생성
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="harvest/$DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add content/inbox/
          git commit -m "레퍼런스 후보 수집 $DATE

          tools/harvest.py 가 Crossref 에서 수집한 신규 후보입니다.
          자동 등재되지 않았습니다 - 원문 확인 후 promote 하세요."
          git push -u origin "$BRANCH"
          {
            echo "\`tools/harvest.py\` 가 Crossref 에서 수집한 신규 레퍼런스 후보입니다."
            echo
            echo "**이 PR 은 후보만 담고 있습니다. \`references.yaml\` 은 건드리지 않았습니다.**"
            echo
            echo '### 검토 방법'
            echo '```bash'
            echo 'python3 tools/harvest.py inbox                      # 미처리 후보 보기'
            echo 'python3 tools/harvest.py promote <DOI> --claims C003 --note "..."'
            echo 'python3 tools/harvest.py drop <DOI>                 # 기각 (다시 안 올라옴)'
            echo 'python3 tools/refcheck.py verify && python3 tools/refcheck.py render'
            echo '```'
            echo
            echo '> 초록만 읽고 등재하지 마세요 — docs/03-editorial-policy.md §2'
            echo
            echo '<details><summary>수집 로그</summary>'
            echo
            echo '```'
            cat harvest.log
            echo '```'
            echo
            echo '</details>'
            echo
            echo '---'
            echo '_Generated by [Claude Code](https://claude.ai/code)_'
          } > pr-body.md
          gh pr create --title "레퍼런스 후보 수집 $DATE" --body-file pr-body.md --base main --head "$BRANCH"
